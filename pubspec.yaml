name: medication_follow_up_app
description: A Flutter starter project for the SWE463 Medication Follow-up App.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  # Person 1 (#3 reminders): Android local notifications at local time.
  flutter_local_notifications: ^23.0.1
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
